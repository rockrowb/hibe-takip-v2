name: Hibe Duyuruları Tarama

on:
  schedule:
    # 06:00 ve 15:00 UTC = TR saatiyle ~09:00 ve ~18:00
    - cron: "0 6 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: {}   # elle de tetiklenebilir (Actions sekmesinden "Run workflow")

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      HAS_AI_KEY: ${{ (secrets.ANTHROPIC_API_KEY != '') || (secrets.GEMINI_API_KEY != '') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Tara (Katman 1 - ham veri)
        run: python scrape.py

      - name: Sınıflandır (Katman 2 - ücretsiz, anahtar kelime)
        run: python classify.py

      - name: AI ile zenginleştir (Katman 3 - opsiyonel, ANTHROPIC_API_KEY ya da GEMINI_API_KEY secret'ı tanımlıysa çalışır)
        if: ${{ env.HAS_AI_KEY == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Not: üst sınır bilinçli olarak yüksek tutuldu (AI'ın birikmiş
        # kayıtları hızlıca işlemesi için). Kota/limit dolarsa script kendini
        # güvenle durdurur ve kaldığı yerden bir sonraki çalıştırmada devam
        # eder (enrich.py'daki QuotaExceeded güvencesi) — bu yüzden yüksek
        # limit vermek riskli değildir.
        run: python enrich.py --limit 150

      - name: AI adımı atlandıysa bile paneli güncel tut
        if: ${{ env.HAS_AI_KEY != 'true' }}
        run: python enrich.py

      - name: Değişiklik varsa commit'le
        run: |
          git config user.name "hibe-takip-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw.json data/classified.json data/duyurular.json
          git diff --cached --quiet || git commit -m "Otomatik güncelleme: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
